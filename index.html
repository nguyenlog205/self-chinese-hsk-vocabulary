<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>HSK Vocabulary Mosaic</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <h1>New HSK 3.0 Vocabulary</h1>
  <p class="subtitle">Loading vocabulary…</p>
  <div class="legend"></div>
  <div style="margin-bottom: 20px;">
    <input type="text" id="vocabSearch" placeholder="Keyword search (Hanzi 汉字, pinyin 拼音, English meaning 英文意义)..."
          style="width: 100%; max-width: 1000px; padding: 10px; font-size: 14px; border-radius: 6px; border: 1px solid var(--text-muted); background: var(--surface-1); color: var(--text-primary); outline: none;">
  </div>

  <div class="poster-scroll">
    <div class="poster"></div>
  </div>

  <div class="card-overlay" id="card-overlay">
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="card-word">
      <div class="card-word-row">
        <div class="card-word" id="card-word"></div>
        <button type="button" class="speak-btn" id="speak-btn" aria-label="Play pronunciation" title="Play pronunciation">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
            <path d="M4 9v6h4l5 5V4L8 9H4z"></path>
            <path d="M16.5 12c0-1.77-.77-3.29-2-4.24v8.48c1.23-.95 2-2.47 2-4.24z" opacity="0.7"></path>
            <path d="M19 12c0-3.13-1.62-5.86-4-7.43v1.95c1.86 1.4 3 3.44 3 5.48s-1.14 4.08-3 5.48v1.95c2.38-1.57 4-4.3 4-7.43z" opacity="0.45"></path>
          </svg>
        </button>
      </div>
      <div class="card-pinyin"></div>
      <div class="card-pos"></div>
      <div class="card-trans"></div>
      <div class="card-level"></div>
      <div class="card-hint">Click outside or press Esc to close</div>
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
